<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO - Impossible AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#071021,#101d40,#0a4d68,#1b1464);
background-size:400% 400%;
animation:bgMove 15s ease infinite;

}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

body::before{

content:'';

position:absolute;

width:180%;
height:180%;

background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 18%),
radial-gradient(circle at 80% 30%,rgba(0,255,255,.08),transparent 18%),
radial-gradient(circle at 50% 80%,rgba(255,0,255,.08),transparent 18%);

animation:rotateBg 30s linear infinite;

}

@keyframes rotateBg{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

.container{

position:relative;

z-index:2;

width:430px;
max-width:95%;

padding:30px;

border-radius:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 0 30px rgba(0,0,0,.5),

0 0 60px rgba(0,255,255,.15);

animation:appear .7s ease;

}

@keyframes appear{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

color:white;

font-size:38px;

text-align:center;

letter-spacing:4px;

margin-bottom:20px;

text-shadow:0 0 15px cyan;

}

.mode{

display:flex;

gap:10px;

margin-bottom:20px;

}

.mode button{

flex:1;

padding:14px;

border:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

cursor:pointer;

transition:.3s;

font-size:15px;

}

.mode button:hover{

background:#00d9ff;

color:black;

transform:translateY(-2px);

}

.active{

background:#00d9ff!important;

color:black!important;

}

.status{

color:white;

text-align:center;

font-size:18px;

margin-bottom:18px;

min-height:25px;

}

.scoreBoard{

display:flex;

justify-content:space-between;

margin-bottom:20px;

gap:10px;

}

.score{

flex:1;

padding:15px;

border-radius:18px;

background:rgba(255,255,255,.07);

text-align:center;

color:white;

}

.score h2{

font-size:18px;

margin-bottom:8px;

}

.score span{

font-size:28px;

font-weight:bold;

}

.board{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

}

.cell{

aspect-ratio:1;

background:rgba(255,255,255,.08);

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:60px;

font-weight:bold;

cursor:pointer;

transition:.25s;

color:white;

user-select:none;

}

.cell:hover{

background:rgba(255,255,255,.18);

transform:scale(1.05);

box-shadow:0 0 20px rgba(0,255,255,.3);

}

.cell.x{

color:#4dd0ff;

text-shadow:0 0 12px #4dd0ff;

}

.cell.o{

color:#ff4de3;

text-shadow:0 0 12px #ff4de3;

}

.win{

background:#00c853!important;

animation:flash .6s infinite alternate;

}

@keyframes flash{

from{

transform:scale(1);

}

to{

transform:scale(1.08);

}

}

.controls{

display:flex;

gap:10px;

margin-top:20px;

}

.controls button{

flex:1;

padding:15px;

font-size:16px;

border:none;

border-radius:15px;

cursor:pointer;

transition:.3s;

font-weight:bold;

}

#restart{

background:#00d9ff;

}

#reset{

background:#ff5252;

color:white;

}

.controls button:hover{

transform:translateY(-2px);

}

.footer{

margin-top:18px;

text-align:center;

color:#ddd;

font-size:14px;

}

@media(max-width:500px){

.container{

padding:20px;

}

.cell{

font-size:45px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>XO GAME</h1>

<div class="mode">

<button id="aiBtn" class="active">
Impossible AI
</button>

<button id="pvpBtn">
2 Players
</button>

</div>

<div class="status" id="status">
Your Turn (X)
</div>

<div class="scoreBoard">

<div class="score">

<h2>You</h2>

<span id="playerScore">0</span>

</div>

<div class="score">

<h2>Draw</h2>

<span id="drawScore">0</span>

</div>

<div class="score">

<h2>Bot</h2>

<span id="botScore">0</span>

</div>

</div>

<div class="board" id="board">

<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>

<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>

<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>

</div>

<div class="controls">

<button id="restart">

Restart Game

</button>

<button id="reset">

Reset Scores

</button>

</div>

<div class="footer">

Impossible AI • Minimax Algorithm • Single HTML File

</div>

<script>

const cells=document.querySelectorAll(".cell");

let board=[
"","","",
"","","",
"","",""
];

let currentPlayer="X";

let gameOver=false;

let aiMode=true;

let playerScore=0;
let botScore=0;
let drawScore=0;

const statusText=document.getElementById("status");

const wins=[

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];

// ===== PART 2 WILL START FROM HERE =====

const playerScoreEl=document.getElementById("playerScore");
const botScoreEl=document.getElementById("botScore");
const drawScoreEl=document.getElementById("drawScore");

document.getElementById("aiBtn").onclick=()=>{

aiMode=true;

document.getElementById("aiBtn").classList.add("active");
document.getElementById("pvpBtn").classList.remove("active");

resetGame();

};

document.getElementById("pvpBtn").onclick=()=>{

aiMode=false;

document.getElementById("pvpBtn").classList.add("active");
document.getElementById("aiBtn").classList.remove("active");

resetGame();

};

cells.forEach((cell,index)=>{

cell.addEventListener("click",()=>{

if(gameOver)return;

if(board[index]!="")return;

if(aiMode){

playerMove(index);

}else{

pvpMove(index);

}

});

});

function playerMove(index){

board[index]="X";

drawBoard();

if(checkGame("X")) return;

statusText.innerHTML="Bot Thinking...";

setTimeout(()=>{

let move=getBestMove();

board[move]="O";

drawBoard();

checkGame("O");

},250);

}

function pvpMove(index){

board[index]=currentPlayer;

drawBoard();

if(checkGame(currentPlayer)) return;

currentPlayer=currentPlayer=="X"?"O":"X";

statusText.innerHTML="Player "+currentPlayer+"'s Turn";

}

function drawBoard(){

cells.forEach((cell,i)=>{

cell.innerHTML=board[i];

cell.className="cell";

if(board[i]=="X") cell.classList.add("x");

if(board[i]=="O") cell.classList.add("o");

});

}

function checkWinner(state){

for(let combo of wins){

let[a,b,c]=combo;

if(

state[a]!="" &&

state[a]==state[b] &&

state[a]==state[c]

){

return{

winner:state[a],

combo:combo

};

}

}

if(!state.includes("")){

return{

winner:"draw"

};

}

return null;

}

function checkGame(player){

let result=checkWinner(board);

if(result==null){

if(aiMode){

statusText.innerHTML="Your Turn";

}else{

statusText.innerHTML="Player "+currentPlayer+"'s Turn";

}

return false;

}

gameOver=true;

if(result.winner=="draw"){

drawScore++;

drawScoreEl.innerHTML=drawScore;

statusText.innerHTML="Draw Game";

return true;

}

result.combo.forEach(i=>{

cells[i].classList.add("win");

});

if(aiMode){

if(result.winner=="X"){

playerScore++;

playerScoreEl.innerHTML=playerScore;

statusText.innerHTML="You Win!";

}else{

botScore++;

botScoreEl.innerHTML=botScore;

statusText.innerHTML="Bot Wins";

}

}else{

statusText.innerHTML="Player "+result.winner+" Wins";

}

return true;

}

function resetGame(){

board=[

"","","",

"","","",

"","",""

];

currentPlayer="X";

gameOver=false;

statusText.innerHTML=aiMode?"Your Turn":"Player X's Turn";

cells.forEach(cell=>{

cell.innerHTML="";

cell.className="cell";

});

}

document.getElementById("restart").onclick=resetGame;

document.getElementById("reset").onclick=()=>{

playerScore=0;

botScore=0;

drawScore=0;

playerScoreEl.innerHTML=0;
botScoreEl.innerHTML=0;
drawScoreEl.innerHTML=0;

resetGame();

};

// ===== PART 3 STARTS HERE =====

function getBestMove(){

let bestScore=-Infinity;
let move=-1;

for(let i=0;i<9;i++){

if(board[i]==""){

board[i]="O";

let score=minimax(board,false);

board[i]="";

if(score>bestScore){

bestScore=score;
move=i;

}

}

}

return move;

}

function minimax(state,isMaximizing){

let result=checkWinner(state);

if(result!=null){

if(result.winner=="O") return 1;

if(result.winner=="X") return -1;

return 0;

}

if(isMaximizing){

let best=-Infinity;

for(let i=0;i<9;i++){

if(state[i]==""){

state[i]="O";

best=Math.max(best,minimax(state,false));

state[i]="";

}

}

return best;

}else{

let best=Infinity;

for(let i=0;i<9;i++){

if(state[i]==""){

state[i]="X";

best=Math.min(best,minimax(state,true));

state[i]="";

}

}

return best;

}

}

resetGame();

</script>

</body>

</html>
